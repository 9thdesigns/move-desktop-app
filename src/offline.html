<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <title>Move</title>
  <!--
    Shown in place of the site when it cannot be reached after launch (on
    first launch the splash shows the same state itself). Same paper, ink and
    mark as src/splash.html. The main process polls the site every few seconds
    and reloads it the moment it answers; this page also retries as soon as
    the browser reports the connection is back, and on the button.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfbfa;
      --ink: #1f1f1f;
      --ink-2: #37352f;
      --mute: #787774;
      --mute-2: #9b9a97;
      --grid: rgba(55, 53, 47, 0.07);
      --gold: #eada96;
      --mark: #000000;
      --btn: #171717;
      --btn-ink: #fbfbfa;
      --btn-press: #2a2a2a;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #191919;
        --ink: rgba(255, 255, 255, 0.88);
        --ink-2: rgba(255, 255, 255, 0.72);
        --mute: #9b9a97;
        --mute-2: #75746f;
        --grid: rgba(255, 255, 255, 0.055);
        --gold: #8a7a3a;
        --mark: rgba(255, 255, 255, 0.92);
        --btn: rgba(255, 255, 255, 0.92);
        --btn-ink: #191919;
        --btn-press: rgba(255, 255, 255, 0.78);
      }
    }
    html, body {
      margin: 0; height: 100%;
      background: var(--paper); color: var(--ink);
      font-family: "FixelText", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Draggable strip so the window can still be moved while offline. */
    .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag; z-index: 1; }
    .grid {
      position: fixed; inset: -1px;
      background-image:
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        linear-gradient(to right, var(--grid) 1px, transparent 1px);
      background-size: calc(100% / 7) 132px;
      background-position: 0 38px;
      -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 0%, rgba(0, 0, 0, 0.5) 45%, transparent 82%);
      mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 0%, rgba(0, 0, 0, 0.5) 45%, transparent 82%);
      pointer-events: none;
    }
    .wrap { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 56px 24px 24px; box-sizing: border-box; }
    .card { width: 100%; max-width: 400px; text-align: center; animation: rise 600ms var(--ease) both; }
    .mark { width: 60px; height: 60px; display: inline-block; }
    .mark .echo { fill: var(--gold); transform: translate(28px, -8px); }
    .mark .ink { fill: var(--mark); }
    h1 { font-size: 22px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; margin: 18px 0 8px; color: var(--ink); }
    p { margin: 0; line-height: 1.5; font-size: 14px; }
    .muted { color: var(--mute); }
    .actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
    .btn {
      appearance: none; border: 0; height: 34px; padding: 0 18px; border-radius: 999px;
      background: var(--btn); color: var(--btn-ink);
      font: inherit; font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background-color 120ms var(--ease), transform 120ms var(--ease);
    }
    .btn:hover { background: var(--btn-press); }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--mute); outline-offset: 3px; }
    .status { margin-top: 16px; font-size: 12px; color: var(--mute-2); display: inline-flex; align-items: center; gap: 7px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #d6b72f; animation: pulse 1.6s ease-in-out infinite; }
    .reason { margin-top: 6px; font-size: 11px; color: var(--mute-2); overflow-wrap: anywhere; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .dot { animation: none; opacity: .8; }
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="wrap">
    <div class="card" role="status" aria-live="polite">
      <svg class="mark" viewBox="96 96 320 320" aria-hidden="true">
        <g class="echo">
          <polygon points="110,116.5 186.5,116.5 245,246 291.5,144 291.5,285 239.5,404.5"/>
          <polygon points="108,146 177,299.33 177,404.5 108,404.5"/>
          <polygon points="303,116.5 376,116.5 376,404.5 303,404.5"/>
        </g>
        <g class="ink">
          <polygon points="110,116.5 186.5,116.5 245,246 291.5,144 291.5,285 239.5,404.5"/>
          <polygon points="108,146 177,299.33 177,404.5 108,404.5"/>
          <polygon points="303,116.5 376,116.5 376,404.5 303,404.5"/>
        </g>
      </svg>
      <h1>Move can’t reach the internet</h1>
      <p class="muted">Check your connection. Move will pick up where you left off as soon as it’s back.</p>
      <div class="actions">
        <button class="btn" id="retry" type="button">Try again</button>
      </div>
      <p class="status"><span class="dot" aria-hidden="true"></span><span id="status">Waiting for a connection…</span></p>
      <p class="reason" id="reason" hidden></p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var origin = params.get('origin') || 'https://m0ve.app';
      var target = params.get('url') || origin + '/welcome';
      if (target !== origin && target.indexOf(origin + '/') !== 0) target = origin + '/welcome';
      var reason = params.get('reason');
      if (reason) {
        var el = document.getElementById('reason');
        el.textContent = reason;
        el.hidden = false;
      }
      var go = function () {
        document.getElementById('status').textContent = 'Reconnecting…';
        window.location.replace(target);
      };
      document.getElementById('retry').addEventListener('click', go);
      window.addEventListener('online', go);
    })();
  </script>
</body>
</html>
