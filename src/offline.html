<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Move</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%;
      background: #f2f2f2; color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #171717; color: #f2f2f2; }
      .card { background: #222; border-color: #333; }
      .muted { color: #a3a3a3; }
      .btn.secondary { background: #2a2a2a; color: #f2f2f2; border-color: #3a3a3a; }
    }
    /* Draggable strip so the window can still be moved while offline. */
    .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 56px 24px 24px; box-sizing: border-box; }
    .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: #171717; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px; }
    .mark span { font-weight: 800; font-size: 26px; color: #f2f2f2; letter-spacing: -0.02em; }
    .mark i { display: inline-block; width: 6px; height: 26px; background: #d6b72f; margin-left: 3px; transform: skewX(-18deg); border-radius: 1px; }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0; line-height: 1.5; font-size: 14px; }
    .muted { color: #6b7280; }
    .actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
    .btn { appearance: none; border: 1px solid transparent; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn.primary { background: #171717; color: #fff; }
    .btn.primary:hover { background: #262626; }
    .btn.secondary { background: #fff; color: #171717; border-color: #d4d4d4; }
    .status { margin-top: 14px; font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d6b72f; margin-right: 6px; animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="wrap">
    <div class="card" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true"><span>M</span><i></i></div>
      <h1>Move can’t reach the internet</h1>
      <p class="muted">Check your connection. Move will pick up where you left off as soon as it’s back.</p>
      <div class="actions">
        <button class="btn primary" id="retry" type="button">Try again</button>
      </div>
      <p class="status muted"><span class="dot"></span><span id="status">Waiting for a connection…</span></p>
      <p class="status muted" id="reason" hidden></p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var origin = params.get('origin') || 'https://m0ve.app';
      var target = params.get('url') || origin + '/welcome';
      if (target !== origin && target.indexOf(origin + '/') !== 0) target = origin + '/welcome';
      var reason = params.get('reason');
      if (reason) {
        var el = document.getElementById('reason');
        el.textContent = reason;
        el.hidden = false;
      }
      var go = function () {
        document.getElementById('status').textContent = 'Reconnecting…';
        window.location.replace(target);
      };
      document.getElementById('retry').addEventListener('click', go);
      window.addEventListener('online', go);
    })();
  </script>
</body>
</html>
