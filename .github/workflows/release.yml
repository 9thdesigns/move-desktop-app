# Two ways to ship, both equivalent:
#
#   - GitHub website: Actions -> Release -> "Run workflow". It releases
#     whatever version package.json is on and creates the tag itself.
#   - Command line:  git tag v0.1.0 && git push origin v0.1.0
#
# Either way the tag must match "version" in package.json. One job pre-creates the GitHub
# Release as a draft, the macOS and Windows jobs build in parallel and only
# upload into it, and a final job publishes the release once every artifact is
# in place — so releases/latest never points at a half-uploaded release and
# electron-updater never sees a latest*.yml before its installer exists.
#
# Signing is optional and driven entirely by repository secrets (README,
# "Getting the builds trusted", walks through obtaining each of them):
#   macOS   CSC_LINK (base64 Developer ID Application .p12), CSC_KEY_PASSWORD,
#           APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows either Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#           AZURE_CLIENT_SECRET, AZURE_TRUSTED_SIGNING_ENDPOINT,
#           AZURE_TRUSTED_SIGNING_ACCOUNT, AZURE_TRUSTED_SIGNING_PROFILE
#           or a certificate file: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the builds are unsigned (users click past Gatekeeper /
# SmartScreen once); auto-update needs signed builds on both platforms.
# When signing is configured, each job verifies the result and fails the
# release rather than shipping an installer that is not actually trusted.

name: Release

on:
  push:
    tags:
      - 'v*'
  # The website path. No input needed: package.json is the source of truth for
  # the version, and the tag is created below if it does not exist yet.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (blank = whatever package.json says)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag, and check it matches package.json
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            TAG="v${REQUESTED#v}"
            [ -z "$REQUESTED" ] && TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::$TAG does not match package.json version $VERSION. Bump package.json (and package-lock.json) on main first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Only for runs started from the Actions tab; a tag push already made it.
      # Pushing with GITHUB_TOKEN does not start a second run of this workflow,
      # so there is no loop.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Move ${{ steps.meta.outputs.version }}"
            git push origin "$TAG"
          fi

      - name: Create the draft release (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag }} already exists; reusing it."
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Move ${{ steps.meta.outputs.version }}" \
              --generate-notes
          fi

  mac:
    name: macOS (arm64 + x64)
    needs: create_release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm test

      # Secrets are not readable inside `if:` expressions, so decide here and
      # only ever put a *non-empty* certificate into the environment. An empty
      # CSC_LINK would be misread by electron-builder as a certificate path.
      - name: Decide whether to sign
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "SIGN_MAC=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_MAC=false" >> "$GITHUB_ENV"
          fi

      - name: Build (Developer ID signed + notarized)
        if: env.SIGN_MAC == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify signature and notarization
        if: env.SIGN_MAC == 'true'
        run: |
          for app in dist/mac-arm64/Move.app dist/mac/Move.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Build (unsigned, ad-hoc signed by afterPack)
        if: env.SIGN_MAC != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npm run dist:mac -- -c.mac.notarize=false

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${{ needs.create_release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Move-mac-*.dmg dist/Move-mac-*.zip dist/*.blockmap dist/latest-mac.yml

  windows:
    name: Windows (x64 + arm64)
    needs: create_release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm test

      # Azure Trusted Signing (recommended: the key never leaves Microsoft's
      # HSM, which is also why a plain .pfx is no longer obtainable for a new
      # certificate), else a certificate file, else unsigned.
      - name: Decide how to sign
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_SECRET }}" ] && [ -n "${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}" ]; then
            echo "SIGN_WIN=azure" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "SIGN_WIN=pfx" >> "$GITHUB_ENV"
          else
            echo "SIGN_WIN=false" >> "$GITHUB_ENV"
          fi

      # This job must never receive the Apple CSC_LINK: electron-builder would
      # try to sign the .exe with the macOS certificate. Only WIN_* / AZURE_*
      # secrets are mapped here.
      - name: Build x64 and arm64 installers (Azure Trusted Signing)
        if: env.SIGN_WIN == 'azure'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          # Passed on the command line rather than kept in electron-builder.yml:
          # once azureSignOptions is present electron-builder insists on
          # signing, which would break the unsigned path.
          AZURE=(
            "-c.win.azureSignOptions.endpoint=$AZURE_TRUSTED_SIGNING_ENDPOINT"
            "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_TRUSTED_SIGNING_ACCOUNT"
            "-c.win.azureSignOptions.certificateProfileName=$AZURE_TRUSTED_SIGNING_PROFILE"
          )
          npm run dist:win:x64 -- "${AZURE[@]}"
          npm run dist:win:arm64 -- "${AZURE[@]}"

      - name: Build x64 and arm64 installers (Authenticode, certificate file)
        if: env.SIGN_WIN == 'pfx'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npm run dist:win:x64
          npm run dist:win:arm64

      - name: Build x64 and arm64 installers (unsigned)
        if: env.SIGN_WIN == 'false'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          npm run dist:win:x64
          npm run dist:win:arm64

      - name: Verify the installers carry a valid Authenticode signature
        if: env.SIGN_WIN != 'false'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem dist/Move-win-*.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${{ needs.create_release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Move-win-*.exe dist/Move-win-*.exe.blockmap dist/latest.yml dist/latest-arm64.yml

  publish:
    name: Publish release
    needs: [create_release, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.create_release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "${{ needs.create_release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
